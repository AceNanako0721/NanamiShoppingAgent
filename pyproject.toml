[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nanami-shopping-agent"
version = "0.1.0"
description = "Host-reasoned shopping capabilities over MCP"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0"]
license = "MIT"
readme = "README.md"

[project.optional-dependencies]
browser = ["playwright==1.65.0"]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "build==1.6.1", "ruff==0.17.4"]

[project.scripts]
nanami-shopping = "nanami_shopping.server:main"
nanami-operator = "nanami_shopping.operator:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["browser: isolated synthetic Chromium integration"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
